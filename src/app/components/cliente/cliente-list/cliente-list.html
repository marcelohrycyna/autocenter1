<div class="container">
    <mat-card>
        <button mat-fab color="primary" (click)="openDialogCreate()">
            <mat-icon>plus_one</mat-icon></button>
        <br/><br/>
        <mat-form-field>
            <input #pesquisa 
                    matInput 
                    (keyup)="applyFilter(pesquisa.value)" 
                    placeholder="Pesquisar Cliente" />
        </mat-form-field>

        <div class="actions" style="margin-bottom: 12px;">
            <button mat-raised-button color="warn" (click)="deletarSelecionados()" [disabled]="!selectedIds.length">
                Excluir selecionados
            </button>
        </div>

        <div class="actions_add" style="margin-bottom: 12px;">
            <button mat-raised-button color="accent" (click)="openExibirAutomoveisDoCliente()" [disabled]="selectedIds.length !== 1">
                Exibir Automóveis
            </button>
        </div>

        <div class="">
            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef>
                        <mat-checkbox
                            [checked]="isAllSelected()"
                            [indeterminate]="selectedIds.length > 0 && !isAllSelected()"
                            (change)="toggleSelectAll()">
                        </mat-checkbox>
                    </th>
                    <td mat-cell *matCellDef="let row">
                        <mat-checkbox [checked]="isSelected(row)" (change)="toggleSelection(row)"></mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                </ng-container>

                <ng-container matColumnDef="cpf">
                    <th mat-header-cell *matHeaderCellDef>Cpf</th>
                    <td mat-cell *matCellDef="let element"> {{element.cpf | mask: '000.000.000-00'}} </td>
                </ng-container>

                <ng-container matColumnDef="telefone">
                    <th mat-header-cell *matHeaderCellDef>Telefone</th>
                    <td mat-cell *matCellDef="let element"> {{element.telefone | mask: '00 00000-0000'}} </td>
                </ng-container>

                <ng-container matColumnDef="editar">
                    <th mat-header-cell *matHeaderCellDef>Editar</th>
                    <td mat-cell *matCellDef="let row">
                        <a mat-mini-fab (click)="openDialogEdit(row.id)">
                            <i class=material-icons icon-blue>edit</i>
                        </a>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
    </mat-card>
</div>
