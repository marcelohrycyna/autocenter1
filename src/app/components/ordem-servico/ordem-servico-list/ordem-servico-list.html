<div class="container">
    <mat-card>
        <button mat-fab color="primary" (click)="openDialogCreate()">
            <mat-icon>plus_one</mat-icon></button>
        <br /><br />

        <mat-form-field appearance="outline" style="width: 230px;">
            <mat-label>* Pesquisar por:</mat-label>
            <mat-select formControlName="pesquisarPor" (selectionChange)="onPesquisarPorChange($event.value)">
                <mat-option value="todos">Todos</mat-option>
                <mat-option value="fechado">Fechado</mat-option>
                <mat-option value="aberto">Aberto</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <input #pesquisa matInput (keyup)="applyFilter(pesquisa.value)" placeholder="Pesquisar OS" />
        </mat-form-field>

        <div class="actions" style="margin-bottom: 12px;">
            <button mat-raised-button color="warn" (click)="deletarSelecionados()" [disabled]="!selectedIds.length">
                Excluir selecionados
            </button>
        </div>

        <div class="">
            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef>
                        <mat-checkbox [checked]="isAllSelected()"
                            [indeterminate]="selectedIds.length > 0 && !isAllSelected()" (change)="toggleSelectAll()">
                        </mat-checkbox>
                    </th>
                    <td mat-cell *matCellDef="let row">
                        <mat-checkbox [checked]="isSelected(row)" (change)="toggleSelection(row)"></mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>
                <ng-container matColumnDef="data_entrada">
                    <th mat-header-cell *matHeaderCellDef>Data Entrada</th>
                    <td mat-cell *matCellDef="let element"> {{element.data_entrada | date: 'dd/MM/yyyy'}} </td>
                </ng-container>

                <ng-container matColumnDef="data_saida">
                    <th mat-header-cell *matHeaderCellDef>Data Saída</th>
                    <td mat-cell *matCellDef="let element"> {{element.data_saida | date: 'dd/MM/yyyy'}}</td>
                </ng-container>

                <ng-container matColumnDef="fechado">
                    <th mat-header-cell *matHeaderCellDef>Fechado</th>
                    <td mat-cell *matCellDef="let element"
                        [ngClass]="{ 'status-fechado': !element.fechado, 'status-aberto': element.fechado }">
                        {{ element.fechado ? 'Sim' : 'Não' }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="cliente_nome">
                    <th mat-header-cell *matHeaderCellDef>Cliente</th>
                    <td mat-cell *matCellDef="let element"> {{element.cliente.nome}} </td>
                </ng-container>

                <ng-container matColumnDef="editar">
                    <th mat-header-cell *matHeaderCellDef>Editar</th>
                    <td mat-cell *matCellDef="let row">
                        <a mat-mini-fab (click)="openDialogEdit(row.id)">
                            <i class=material-icons icon-blue>edit</i>
                        </a>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
    </mat-card>
</div>
